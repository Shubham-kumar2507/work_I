apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: iot-monitoring
data:
  NODE_ENV: "production"
  PORT: "5000"
  DATADOG_SITE: "datadoghq.com"
  FRONTEND_URL: "https://your-domain.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: iot-monitoring
data:
  MONGO_INITDB_DATABASE: "iot-dashboard"
